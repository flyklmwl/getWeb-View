<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>getWeb-View — {% block title %}爬虫监控{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-size: 14px; }
        .navbar { background: #1a1a2e; }
        .navbar-brand { color: #e94560 !important; font-weight: 700; }
        .stat-card { background: #fff; border-radius: 8px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .stat-card .num { font-size: 22px; font-weight: 700; }
        .crawler-card { background: #fff; border-radius: 6px; padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: transform .12s; display: flex; align-items: center; justify-content: space-between; }
        .crawler-card:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        .crawler-card.active { border-left: 3px solid #27ae60; }
        .crawler-card .name { font-weight: 600; font-size: 13px; color: #2c3e50; }
        .crawler-card .count { font-size: 16px; font-weight: 700; }
        .crawler-card .ago { font-size: 11px; color: #95a5a6; margin-top: 1px; }
        .crawler-card .crawler-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
        .section-title { font-size: 16px; font-weight: 600; margin: 24px 0 12px; }
        .idle-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .idle-tag { background: #ecf0f1; color: #7f8c8d; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .sort-bar { display: flex; gap: 2px; background: #e9ecef; border-radius: 6px; padding: 2px; }
        .sort-btn { font-size: 12px; padding: 3px 10px; border-radius: 4px; color: #6c757d; text-decoration: none; transition: .15s; }
        .sort-btn:hover { color: #2c3e50; }
        .sort-btn.active { background: #fff; color: #2c3e50; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .item-row { padding: 10px 0; border-bottom: 1px solid #eee; }
        .item-row:nth-child(even) { background: #f8f9fa; }
        .item-row:last-child { border-bottom: none; }
        .item-title { font-size: 14px; color: #2c3e50; }
        .item-title a { color: #2c3e50; text-decoration: none; }
        .item-title a:hover { color: #e94560; }
        .item-time { font-size: 12px; color: #95a5a6; }
        .source-tag { display: inline-block; background: #e8f4fd; color: #2980b9; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-right: 6px; font-weight: 500; }
        .source-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .source-count { font-size: 12px; background: #ecf0f1; color: #7f8c8d; padding: 2px 8px; border-radius: 10px; text-decoration: none; }
        .source-count:hover { background: #e94560; color: #fff; }
        .back-link { color: #7f8c8d; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #2c3e50; }
        .error-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 40px; text-align: center; }
        .page-link { font-size: 13px; color: #2c3e50; border: none; padding: 6px 12px; }
        .page-link:hover { background: #e9ecef; color: #2c3e50; }
        .page-item.active .page-link { background: #e94560; border-color: #e94560; }
        .page-item.disabled .page-link { color: #bdc3c7; }
        .search-input { font-size: 13px; padding: 4px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; background: rgba(255,255,255,.1); color: #fff; outline: none; width: 180px; transition: .2s; }
        .search-input::placeholder { color: rgba(255,255,255,.4); }
        .search-input:focus { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.15); width: 240px; }
        .search-inline { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-inline input { font-size: 13px; padding: 5px 12px; border: 1px solid #dee2e6; border-radius: 6px; outline: none; flex: 1; }
        .search-inline input:focus { border-color: #e94560; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">getWeb-View</a>
        <span class="text-light opacity-75 me-auto ms-2" style="font-size: 13px;">爬虫数据面板</span>
        <form action="/search" method="get" class="d-flex">
            <input name="q" class="search-input" placeholder="搜索标题..." value="">
        </form>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
